<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modbus RTU Sniffer</title>
    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f6f8;
            margin:0;
            color:#222
        }

        header{
            background:#0b3d5c;
            color:white;
            padding:16px 20px
        }

        header h1{
            font-size:22px;
            margin:0 0 10px 0
        }

        nav a{
            display:inline-block;
            color:white;
            text-decoration:none;
            background:#1565c0;
            padding:8px 12px;
            border-radius:8px;
            margin-right:8px
        }

        .wrap{
            max-width:1180px;
            margin:0 auto;
            padding:18px
        }

        .card{
            background:white;
            border-radius:12px;
            padding:14px;
            box-shadow:0 2px 8px rgba(0,0,0,.12)
        }

        .card h2{
            font-size:17px;
            margin:0 0 10px 0;
            color:#0b3d5c
        }

        input{
            box-sizing:border-box;
            padding:9px;
            border:1px solid #bbb;
            border-radius:8px;
            font-size:15px;
            background:white
        }

        button,.btn{
            display:inline-block;
            box-sizing:border-box;
            border:0;
            border-radius:8px;
            background:#1565c0;
            color:white;
            padding:10px 12px;
            font-size:15px;
            font-weight:bold;
            text-align:center;
            text-decoration:none;
            cursor:pointer
        }

        .row{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            align-items:center
        }

        .console{
            background:#111;
            color:#0f0;
            font-family:Consolas,monospace;
            font-size:13px;padding:10px;
            border-radius:8px
            ;height:360px;
            overflow-y:auto;
            white-space:pre-wrap;
            box-shadow:inset 0 0 5px rgba(0,0,0,.6)
        }

        .small{
            font-size:12px;
            color:#666;
            line-height:1.4
        }

        hr{
            border:0;
            border-top:1px solid #ddd;
            margin:16px 0
        }

    </style>
</head>
<body>
    <header>
        <h1>Modbus RTU Sniffer</h1>
        <nav>
            <a href="/">Painel</a>
            <a href="/config">Configuração</a>
        </nav>
    </header>

    <div class="wrap">
        <div class="card">
            <h2>Painel Principal</h2>

            <div class="row">
                <input id="fileName" type="text" value="sniffing_modbus.txt" />
                <button onclick="saveFile()">Salvar arquivo</button>
                <a class="btn" href="/config">Configurar Modbus</a>
            </div>

            <p class="small">Os dados recebidos pela UART são exibidos abaixo em tempo real via WebSocket</p>
            <hr />
            <h2>Console</h2>
            <div id="console" class="console">Sniffer Iniciado&#10;</div>       
        </div> 
    </div>
  <script>
    let ws = new WebSocket('ws://' + location.hostname + ':81/');

    ws.onopen = () => appendConsole("Conectado ao WebSocket");
    ws.onerror = (e) => appendConsole("Erro no WebSocket: ", e);
    ws.onclose = () => appendConsole("WebSocket desconectado");

    ws.onmessage = (e) => appendConsole(e.data);

    function appendConsole(text) {
        const consoleDiv = document.getElementById('console');
        consoleDiv.innerText += text + '\n';
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function saveFile() {
        let fileName = document.getElementById('fileName').value || "sniffing_modbus.txt";
        /* Código para salvar o arquivo no dispositivo do usuário sem utilizar o console */
        let content = document.getElementById('console').innerText;
        let blob = new Blob([content], { type: 'text/plain' });
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

  </script>
</body>
